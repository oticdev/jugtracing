# Minimal single-binary Tempo: receive OTLP from the Collector, store traces on local disk.
# TraceQL metrics ({...} | rate(), quantile_over_time) work out of the box in Tempo 3.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
