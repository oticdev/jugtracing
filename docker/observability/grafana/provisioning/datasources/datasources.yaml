# $$ escapes Grafana's env-var interpolation so the ${...} reaches the datasource as-is.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    isDefault: true
    jsonData:
      nodeGraph:
        enabled: true
      streamingEnabled:
        search: true
        metrics: true
      # Span -> "Logs for this span" in Loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__span.traceId}"'

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      # Log line -> trace in Tempo (trace_id is OTLP structured metadata)
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
