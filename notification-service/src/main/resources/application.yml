server:
  port: 8083

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Reads traceparent/baggage from the record headers and continues the trace.
      observation-enabled: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.naijajug.tracing.notification.OrderPlacedEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      order-events: order-events
  email:
    simulated-latency-ms: 200

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      # Export every trace; the OTel Collector decides what to keep (tail sampling).
      probability: 1.0
    baggage:
      # W3C baggage we accept and forward (HTTP headers and Kafka headers)...
      remote-fields: customer.tier
      # ...copy into the MDC, so every log line carries it...
      correlation:
        fields: customer.tier
      # ...and add as an attribute on every span, so TraceQL and tail sampling can use it.
      tag-fields: customer.tier
  opentelemetry:
    resource-attributes:
      "[deployment.environment]": naijajug-demo
      "[service.namespace]": jugtracing
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URL:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_URL:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        # No metrics backend in this demo (traces + logs only).
        enabled: false

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},tier=%X{customer.tier:-}] "
