name: jugtracing

services:
  postgres:
    image: postgres:18
    container_name: jugtracing-postgres
    environment:
      POSTGRES_USER: jug
      POSTGRES_PASSWORD: jug
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jug"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: jugtracing-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: jugtracing-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: jugtracing
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Observability: apps --OTLP--> otel-collector --> Tempo (traces) / Loki (logs) <-- Grafana ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: jugtracing-otel-collector
    # Switch to tail sampling during the demo:
    #   COLLECTOR_CONFIG=otel-collector-tail-sampling.yaml docker compose up -d otel-collector
    command: ["--config=/etc/otelcol/${COLLECTOR_CONFIG:-otel-collector.yaml}"]
    volumes:
      - ./docker/observability/collector:/etc/otelcol:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (what the Spring services use)
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:3.1.0
    container_name: jugtracing-tempo
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.7.8
    container_name: jugtracing-loki
    # The image's default config already accepts OTLP logs on /otlp.
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: jugtracing-grafana
    environment:
      # No login screen on stage.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tracing-overview.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki

  # Steady background traffic through the gateway (services run on the host, in IntelliJ).
  #   docker compose --profile load up -d k6
  k6:
    image: grafana/k6:2.3.0
    container_name: jugtracing-k6
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    environment:
      BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/k6:/scripts:ro

volumes:
  postgres-data:
  tempo-data:
